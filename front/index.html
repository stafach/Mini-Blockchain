<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Mini-Blockchain</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">
    <nav class="navbar">
        <div class="container">
            <a class="navbar-brand" href="index.html">Mini-Blockchain</a>
            <div class="nav-buttons">
                <a href="mine.html" class="btn-mine">Mine a block</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="validate">
            <h2>Complete Blockchain</h2>
        </div>
        
        <div id="blockchain-container"></div>
    </div>

    <div class="container">
        <div class="validate">
            <button onclick="checkIntegrity(event)" class="btn-warning">Check integrity</button>
        </div>
    </div>

    <div id="customModal" class="modal-overlay">
        <div class="modal-content">
            <h3 id="modalTitle"></h3>
            <p id="modalMessage"></p>
            <div id="modalBtn" class="btn-success" style="cursor: pointer; margin-top: 20px; max-width: 200px;">OK</div>
        </div>
    </div>

    <script>
        // Prevents the injection of HTML scripts into the data
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Function to display the stylized modal
        function showModal(title, message, isSuccess) {
            const modal = document.getElementById('customModal');
            const modalBtn = document.getElementById('modalBtn');
            
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalMessage').innerText = message;
            
            modalBtn.style.backgroundColor = isSuccess ? "var(--accent)" : "var(--danger)";
            
            modal.classList.add("active");
            
            modalBtn.onclick = function() {
                modal.classList.remove("active");
            };
        }

        // Function for load and display the blockchain
        async function loadBlockchain() {
            // Try to retrieves all the complete blockchain
            try {
                        const response = await fetch('http://127.0.0.1:5001/blocks/');
                        const blocks = await response.json();
                        const container = document.getElementById('blockchain-container');
                        
                        // Manages each block
                        container.innerHTML = blocks.map(block => {
                            // Manages the date
                            const date = block.timestamp 
                                ? new Date(block.timestamp * 1000).toLocaleString('fr-FR') 
                                : "Date inconnue";

                            // Create a variable with all transactions of the block
                            const transactionsHtml = block.transactions.map(tx => `
                                <div class="tx-item">
                                    <span class="tx-user">${escapeHtml(tx.sender)}</span> 
                                    <span class="tx-arrow">&rarr;</span> 
                                    <span class="tx-user">${escapeHtml(tx.receiver)}</span> : 
                                    <span class="tx-amount">${tx.amount.toFixed(2)}</span>
                                </div>
                            `).join('');

                            // Return the block
                            return `
                                <div class="card block-card">
                                    <div class="card-header block-header">
                                        <span class="block-index">Bloc #${block.index}</span>
                                        <div class="block-meta">
                                            <span class="badge-count">
                                                ${block.tx_count} Transaction${block.tx_count > 1 ? 's' : ''}
                                            </span>
                                            <small class="block-date">${date}</small>
                                        </div>
                                    </div>
                                    <div class="card-body">
                                        <div class="hash-section">
                                            <p><strong>Hash:</strong> <span class="text-break">${block.hash}</span></p>
                                            <p><strong>Previous Hash:</strong> <span class="text-break">${block.previous_hash}</span></p>
                                        </div>
                                        
                                        <div class="tx-list">
                                            ${transactionsHtml}
                                        </div>

                                        <div class="block-footer">
                                            <strong>Nonce:</strong> <span class="nonce">${block.nonce}</span>
                                        </div>
                                    </div>
                                </div>
                            `;
                        }).join('');
                        
                    } catch (error) {
                        console.error("Erreur de chargement:", error);
                    }
                }

        async function checkIntegrity(event) {
            if (event) event.preventDefault();
            
            try {
                const response = await fetch('http://127.0.0.1:5001/blocks/validate');
                const data = await response.json();
                
                if (response.ok) {
                    showModal("Success!", data.message, true);
                } else {
                    showModal("Corruption Detected!", data.message, false);
                }
            } catch (error) {
                showModal("Error", "API is not reachable.", false);
            }
        }


        loadBlockchain();
    </script>
</body>
</html>
