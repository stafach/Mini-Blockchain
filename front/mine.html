<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Mine a block</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <div class="mining-card">
            <div class="card-header">
                <h3>Mine a new Block</h3>
            </div>
            
            <div class="card-body">
                <p class="hint">Fill at least the first row. Maximum 5 transactions allowed.</p>
                <div id="transactionsContainer">
                    <div class="tx-row">
                        <div class="tx-number">#1</div>
                        <input type="text" placeholder="Sender" class="input-field sender" maxlength="50">
                        <span>&rarr;</span>
                        <input type="text" placeholder="Receiver" class="input-field receiver" maxlength="50">
                        <input type="number" placeholder="Amt" class="input-field amount-input amount" step="0.01">
                    </div>
                    <div class="tx-row"><div class="tx-number">#2</div><input type="text" placeholder="Sender" class="input-field sender" maxlength="50"><span>&rarr;</span><input type="text" placeholder="Receiver" class="input-field receiver" maxlength="50"><input type="number" placeholder="Amt" class="input-field amount-input amount"></div>
                    <div class="tx-row"><div class="tx-number">#3</div><input type="text" placeholder="Sender" class="input-field sender" maxlength="50"><span>&rarr;</span><input type="text" placeholder="Receiver" class="input-field receiver" maxlength="50"><input type="number" placeholder="Amt" class="input-field amount-input amount"></div>
                    <div class="tx-row"><div class="tx-number">#4</div><input type="text" placeholder="Sender" class="input-field sender" maxlength="50"><span>&rarr;</span><input type="text" placeholder="Receiver" class="input-field receiver" maxlength="50"><input type="number" placeholder="Amt" class="input-field amount-input amount"></div>
                    <div class="tx-row"><div class="tx-number">#5</div><input type="text" placeholder="Sender" class="input-field sender" maxlength="50"><span>&rarr;</span><input type="text" placeholder="Receiver" class="input-field receiver" maxlength="50"><input type="number" placeholder="Amt" class="input-field amount-input amount"></div>
                </div>
            </div>

                <div id="mineBtn" class="btn-success" style="text-align: center; display: block; cursor: pointer;" onclick="mineBlock(event)">
                    Start mining
                </div>
            </div>
            </div>

        <div class="footer-link">
            <a href="index.html">Back to the blockchain</a>
        </div>
    </div>

    <div id="customModal" class="modal-overlay">
        <div class="modal-content">
            <h3 id="modalTitle"></h3>
            <p id="modalMessage"></p>
            <div id="modalBtn" class="btn-success" style="cursor: pointer; margin-top: 20px;">OK</div>
        </div>
    </div>

    <script>
        // Function to display the modal and manage redirection
        function showModal(title, message, isSuccess) {
            const modal = document.getElementById('customModal');
            const modalBtn = document.getElementById('modalBtn');

            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalMessage').innerText = message;

            // Color: Green for success, Red for error
            modalBtn.style.backgroundColor = isSuccess ? "var(--accent)" : "var(--danger)";
            
            // The modal is displayed
            modal.classList.add("active");

            // Define what happens when we click OK
            modalBtn.onclick = function(e) {
                e.preventDefault();
                e.stopPropagation();
                
                if (isSuccess) {
                    // If success redirection to the homepage
                    window.location.replace("index.html");
                } else {
                    // If error we return to the mining page
                    modal.classList.remove("active");
                    const mineBtn = document.getElementById('mineBtn');
                }
            };
        }

        async function mineBlock(event) {
            // immediately blocks all browser actions
            if (event) {
                event.preventDefault();
                event.stopPropagation();
            }

            // Retrieves all transactions
            const rows = document.querySelectorAll('.tx-row');
            let transactions = []; // Create empty list for add all transactions

            // Retrieves data of each transaction
            rows.forEach(row => {
                const from = row.querySelector('.sender').value.trim();
                const to = row.querySelector('.receiver').value.trim();
                const am = row.querySelector('.amount').value;

                // Add only if not empty transactions
                if (from !== "" && to !== "" && am !== "") {
                    transactions.push({
                        sender: from,
                        receiver: to,
                        amount: parseFloat(am)
                    });
                }
            });

            // Check if there is at least 1 transaction
            if (transactions.length === 0) {
                showModal("Error", "Please fill at least one complete transaction!", false);
                return;
            }


            try {
                const response = await fetch('http://127.0.0.1:5001/blocks/add', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({transactions: transactions})
                });

                const result = await response.json();
                
                if (response.ok) {
                    showModal("Success!", "Block #" + result.index + " has been added.", true);
                } else {
                    showModal("Mining Error", "Blockchain corrupt", false);
                }
            } catch (error) {
                showModal("Connection Error", "API is not reachable.", false);
            }
            return false;
        }
    </script>
</body>
</html>
